<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>询价页 · 模块点击率热力图</title>
<style>
  /* ============================================================
     询价页模块点击率热力图（独立演示文件，不依赖也不改动其他页面）
     - 模块划分沿用配置端「询价页」热力区域（百分比坐标）
     - 点击率取自《usergrowth_create_journey_lift_明细.md》
     - 热力层为 canvas 实时生成：先按区域铺高斯点得到灰度，再用色带上色
     ============================================================ */
  :root{
    --brand:#00b2ff;
    --fg-1:#333333;
    --fg-2:#666666;
    --muted:#9ca3af;
    --page-bg:#f4f6f8;
    --surface:#fff;
    --line:#e5e7eb;
    --chip:#f2f6fa;
    --hot:#ff6a00;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--page-bg);color:var(--fg-1);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Arial,sans-serif;
       font-size:14px;-webkit-font-smoothing:antialiased;padding:24px;}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  .card{background:var(--surface);border-radius:12px;padding:20px 24px 24px;
        filter:drop-shadow(0 2px 4px rgba(0,0,0,.03));}
  .card-hd{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .card-title{font-size:18px;font-weight:700;}
  .card-sub{font-size:13px;color:var(--muted);}
  .tools{margin-left:auto;display:flex;gap:16px;}
  .ic{width:30px;height:30px;border-radius:50%;background:var(--chip);color:var(--fg-1);
      display:flex;align-items:center;justify-content:center;cursor:pointer;
      transition:color .15s,background .15s;}
  .ic:hover{color:var(--brand);}
  .ic.off{color:var(--muted);}
  .ic svg{width:30px;height:30px;display:block;}

  .body{display:flex;gap:32px;align-items:flex-start;margin-top:16px;}

  /* ===== 手机外壳 ===== */
  .phone{position:relative;width:330px;flex:none;padding:14px;border-radius:38px;
         background:#111;box-shadow:0 10px 30px rgba(0,0,0,.18);}
  .screen{position:relative;width:302px;border-radius:26px;overflow:hidden;background:#fff;}
  .screen img{display:block;width:302px;height:auto;}
  /* 不加 CSS blur：扁长区域（如「立即呼叫」133x46）的中心平台在 y 方向仅约 12px，
     任何模糊核都会把它冲淡，而品类卡片的平台有 68px 高完全不受影响——
     结果热度会由区域面积而非点击率决定。柔和边缘交给渐变本身。 */
  .screen canvas{position:absolute;left:0;top:0;width:302px;pointer-events:none;
                 transition:opacity .2s ease;}
  .notch{position:absolute;left:50%;top:14px;transform:translateX(-50%);
         width:96px;height:22px;border-radius:0 0 12px 12px;background:#111;z-index:3;}

  /* 点击率标签 */
  .tag{position:absolute;z-index:4;transform:translate(-50%,-50%);
       background:#fff;color:var(--fg-1);font-size:12px;font-weight:600;line-height:1;
       padding:5px 8px;border-radius:9px;white-space:nowrap;cursor:default;
       box-shadow:0 2px 6px rgba(0,0,0,.22);transition:opacity .2s ease;}
  .tag.top{background:var(--hot);color:#fff;box-shadow:0 2px 8px rgba(255,106,0,.45);}
  .tag.none{color:var(--muted);font-weight:500;}
  .tag:hover{z-index:6;}
  .hide{opacity:0 !important;}

  /* ===== 右侧 ===== */
  .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px;}
  .legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg-2);}
  .legend .bar{flex:1;height:10px;border-radius:5px;
    background:linear-gradient(90deg,#dff6ff 0%,#00c2ff 18%,#00e0b0 38%,#7ce84f 58%,#ffdc00 78%,#ff2814 100%);}

  table{width:100%;border-collapse:separate;border-spacing:0;}
  th{background:#f8fafc;color:var(--fg-2);font-size:13px;font-weight:700;text-align:left;
     padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--fg-1);}
  tbody tr{cursor:pointer;transition:background .15s;}
  tbody tr:hover,tbody tr.on{background:#f0faff;}
  .mid{font-size:11px;color:var(--muted);word-break:break-all;}
  .rate{font-weight:700;white-space:nowrap;}
  .bar-cell{width:120px;}
  .bar-out{height:6px;border-radius:3px;background:#eef1f5;overflow:hidden;}
  .bar-in{height:6px;border-radius:3px;background:linear-gradient(90deg,#7ce84f,#ffdc00,#ff2814);}
  .note{font-size:12px;line-height:1.7;color:var(--fg-2);
        background:#fbfcfd;border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
  .note b{color:var(--fg-1);}
  .note code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
             background:#f2f6fa;padding:1px 5px;border-radius:3px;}

  @media (max-width:900px){
    .body{flex-direction:column;}
    .side{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-hd">
      <div>
        <div class="card-title">页面热力图</div>
        <div class="card-sub">询价页 · 按模块点击率着色</div>
      </div>
      <div class="tools">

        </span>

    <div class="body">
      <div class="phone">

        <div class="screen" id="screen">
          <img id="shot" src="image/%E8%AF%A2%E4%BB%B7%E9%A1%B5.png" alt="询价页效果图">
          <canvas id="heat"></canvas>

      <div class="side">
        <div class="legend"><span>点击率低</span><span class="bar"></span><span>高</span></div>
        <table>
          <thead><tr>
            <th>模块</th><th>点击UV</th><th>点击率</th><th class="bar-cell">分布</th>
          </tr></thead>
          <tbody id="tb"></tbody>
        </table>
        <div class="note" id="note"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   模块划分：沿用配置端「询价页」的热力区域（相对效果图的百分比）
   点击率：《usergrowth_create_journey_lift_明细.md》点击UV ÷ 曝光UV
   ============================================================ */
const PAGE_EXPO_UV = 1893507;   /* 页面曝光UV：品类卡片曝光UV 1842382 ÷ 曝光率 97.3% */

const MODULES = [
  {id:'usergrowth_create_journey_lift_map',          name:'地图',
   left:83,  top:17.5, width:14,   height:7.2,  clickUv:null,    rate:null,  base:'—',
   note:'该模块未埋点击'},
  {id:'usergrowth_create_journey_lift_services',     name:'顺风车增值服务模块',
   left:1,   top:25.5, width:98,   height:7,    clickUv:45724,   rate:1.2,   base:'自身曝光'},
  {id:'usergrowth_create_journey_lift_highway_tips', name:'高速费通知条',
   left:1,   top:33,   width:98,   height:4.6,  clickUv:106892,  rate:3.3,   base:'自身曝光'},
  {id:'usergrowth_fold_sku_icon',                    name:'品类折叠图标',
   left:1,   top:38,   width:16,   height:38.5, clickUv:12559,   rate:0.1,   base:'自身曝光'},
  {id:'usergrowth_create_journey_lift_sku_list',     name:'品类卡片',
   left:17.5,top:38,   width:81.5, height:40.5, clickUv:1134458, rate:66.0,  base:'自身曝光'},
  {id:'usergrowth_create_journey_lift_module_list',  name:'模块展示（权益条）',
   left:1,   top:79,   width:98,   height:6,    clickUv:141357,  rate:6.0,   base:'自身曝光'},
  {id:'usergrowth_create_journey_lift_remark',       name:'行程备注',
   left:70,  top:85.5, width:29,   height:5,    clickUv:81423,   rate:4.3,   base:'页面曝光'},
  {id:'usergrowth_create_journey_lift_price_detail', name:'价格详情气泡',
   left:1,   top:90,   width:52,   height:7,    clickUv:10602,   rate:0.1,   base:'自身曝光'},
  {id:'usergrowth_create_journey_lift_create_order', name:'立即呼叫',
   left:55,  top:90,   width:44,   height:7,    clickUv:1124583, rate:59.4,  base:'页面曝光'}
];

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rated = MODULES.filter(m => m.rate != null);
const MAX   = Math.max.apply(null, rated.map(m=>m.rate));

/* ---------- 热力层 ---------- */
/* 色带：透明 → 淡蓝 → 青 → 青绿 → 绿 → 黄绿 → 黄 → 橙 → 橙红 → 红
   节点从 6 个加到 11 个，作用是把黄→橙→橙红→红这段色相路径显式定下来，
   原先靠黄(.74)到红(1.0)两端线性插值，中途偏色不好控。
   别指望加节点能改善过渡：实测色带自身的斜率突变峰值 8→9，几乎没变。
   过渡自然与否主要由红核大小和衰减曲线决定，见 drawHeat 里的 stops。
   红色压到 0.91 之后才出现，这一项才真正让中心红核收小。
   低端 alpha 不宜再压低：上色时还会再乘一次位置系数（见 drawHeat 末尾），
   0.1% 这类模块本就极淡，低端一压就彻底看不见了。 */
function palette(){
  const c = document.createElement('canvas');
  c.width = 1; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,256);
  g.addColorStop(0.00,'rgba(0,110,255,0)');
  g.addColorStop(0.05,'rgba(0,150,255,.20)');
  g.addColorStop(0.12,'rgba(0,188,255,.50)');
  g.addColorStop(0.21,'rgba(0,212,224,.62)');
  g.addColorStop(0.32,'rgba(0,226,172,.72)');
  g.addColorStop(0.44,'rgba(74,231,116,.78)');
  g.addColorStop(0.57,'rgba(158,234,66,.82)');
  g.addColorStop(0.70,'rgba(226,225,26,.86)');
  g.addColorStop(0.81,'rgba(255,188,10,.89)');
  g.addColorStop(0.91,'rgba(255,122,14,.91)');
  g.addColorStop(1.00,'rgba(201,40,22,.93)');   /* #C92816 */
  x.fillStyle = g;
  x.fillRect(0,0,1,256);
  return x.getImageData(0,0,1,256).data;
}

/* 单点核：中心一小块满强度平台，往外按 (1-q)² 衰减。q 是归一化后的平方距离。
   平台必不可少——纯 (1-q)² 的中心是个尖点，归一化后只有极小一圈能进红色区间，
   实测红核只剩 1px。单椭圆版本的衰减曲线开头就有 8% 满强度平台，
   红核尺寸正是那个平台撑出来的。平台半径 ∝ √P，P=0.02 时红核约 37px。
   用平方距离查表省掉每像素一次 sqrt；有限支撑，不必为高斯长尾多算像素。 */
const HEAT_KERNEL = (() => {
  const lut = new Float32Array(257);
  const P = 0.02;
  for(let i = 0; i <= 256; i++){
    const q = i / 256;
    if(q <= P){ lut[i] = 1; continue; }
    const u = (1 - q) / (1 - P);
    lut[i] = u * u;
  }
  return lut;
})();

/* 确定性伪随机：同一模块每次渲染核的排布一致，不会刷新一下形状就变 */
function heatRand(seed){
  let s = (seed * 9301 + 49297) % 233280;
  return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
}

/* 高端压缩：归一化后的密度过一遍 γ=1.1，收一下高端。
   压太狠会把红核吃掉（实测 γ=1.9 时只剩 15px）。 */
const HEAT_GAMMA = (() => {
  const lut = new Float32Array(257);
  for(let i = 0; i <= 256; i++) lut[i] = Math.pow(i / 256, 1.1);
  return lut;
})();

function drawHeat(){
  const img = document.getElementById('shot');
  const cv  = document.getElementById('heat');
  const W = img.clientWidth, H = img.clientHeight;
  if(!W || !H) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';

  /* 1) 热度层：每个模块 2~4 个核串成一条链，核之间取最大值，最后按峰值归一化。
     单个椭圆渐变画出来永远是规则椭圆，不像热力图；随机撒一堆点也不行——
     中心极限定理会把它们叠成平滑钟形，越撒越规则。所以核数和核间距都显式控制。 */
  const CW = cv.width, CH = cv.height;
  const acc = new Float32Array(CW * CH);   /* 每像素热度 0~1，模块重叠处取最大值 */

  MODULES.forEach((m, zi) => {
    if(m.rate == null) return;                       /* 无点击数据不着色 */
    const x0 = m.left/100 * CW,  y0 = m.top/100 * CH;
    const w  = m.width/100 * CW, h  = m.height/100 * CH;
    /* 0.5 次幂压缩：线性映射时 0.1% 相对 66% 几乎不可见，压缩后仍能看出淡色 */
    const inten = Math.max(0.12, Math.pow(m.rate / MAX, 0.5));
    const cx = x0 + w/2, cy = y0 + h/2;

    /* 外缘沿用单椭圆版本的算法，覆盖范围才不会变：
       半径按区域放大一档往模块外扩散；离心率钳到 0.55，否则扁长条
       （高速费通知条 98%x4.6%）会薄成一条线，钳住后能往短边外侧扩散开。 */
    const rx = Math.max(w * 0.66, 15 * dpr);
    const ry = Math.max(h * 0.66, 17 * dpr);
    const r  = Math.max(rx, ry);
    const sx = Math.max(rx / r, 0.55), sy = Math.max(ry / r, 0.55);

    /* 间距是这里唯一要紧的参数，单位取核半径 R：
         < 1.0R  两核完全融合，又变回一个椭圆；
         > 2.0R  散成互不相干的独立斑点，不像一片热区；
         1.1~1.4R 相连但留出腰身，轮廓才有起伏。
       核数上限看短轴，不看长轴 r——扁长条长轴很大，按长轴算会分到 4 个核，
       每个核被短轴压扁后红核只剩几个像素。 */
    const rnd  = heatRand(zi + 1);
    const uni  = () => rnd() * 2 - 1;
    const maxK = Math.max(2, Math.min(4, Math.round(Math.min(rx, ry) / (9 * dpr))));
    const K    = 2 + Math.floor(rnd() * (maxK - 1));
    /* 核半径随核数缩小，使整条链的跨度仍等于原来单椭圆的直径 */
    const R = 2 * r / ((K - 1) * 1.25 + 2);

    const chain = [{x: 0, y: 0}];
    let ang = rnd() * 6.2832, px = 0, py = 0;
    for(let i = 1; i < K; i++){
      ang += uni() * 0.7;                            /* 每节转 ±40°，不走成直线也不绕回来 */
      const step = 1.1 + rnd() * 0.3;
      px += Math.cos(ang) * step; py += Math.sin(ang) * step;
      chain.push({x: px, y: py});
    }
    /* 主核取链的中段，并且拿它（而不是链的重心）对齐模块中心。
       主核是归一化后唯一进红色区间的那个，放在端点的话红核会跑到模块角上。 */
    const mainI = K >> 1;
    const ox = chain[mainI].x, oy = chain[mainI].y;

    const pts = [];
    let xa = CW, xb = 0, ya = CH, yb = 0;
    chain.forEach((c, i) => {
      /* 主核要明显更大，不能只是权重更高：红核半径约等于 0.14×核半径，
         而 R 随核数变小，主核不放大的话红核只剩几个像素。 */
      const jit = i === mainI ? 1.35 : 0.75 + 0.2 * rnd();
      const p = {
        x: cx + (c.x - ox) * R * sx, y: cy + (c.y - oy) * R * sy,
        kx: R * sx * jit, ky: R * sy * jit,
        wgt: i === mainI ? 1 : 0.72 + 0.2 * rnd()
      };
      pts.push(p);
      xa = Math.min(xa, Math.floor(p.x - p.kx)); xb = Math.max(xb, Math.ceil(p.x + p.kx));
      ya = Math.min(ya, Math.floor(p.y - p.ky)); yb = Math.max(yb, Math.ceil(p.y + p.ky));
    });
    xa = Math.max(0, xa); xb = Math.min(CW - 1, xb);
    ya = Math.max(0, ya); yb = Math.min(CH - 1, yb);
    const bw = xb - xa + 1, bh = yb - ya + 1;
    if(bw <= 0 || bh <= 0) return;

    const den = new Float32Array(bw * bh);
    pts.forEach(p => {
      const px0 = Math.max(xa, Math.floor(p.x - p.kx)), px1 = Math.min(xb, Math.ceil(p.x + p.kx));
      const py0 = Math.max(ya, Math.floor(p.y - p.ky)), py1 = Math.min(yb, Math.ceil(p.y + p.ky));
      for(let y = py0; y <= py1; y++){
        const dy  = (y + 0.5 - p.y) / p.ky, dy2 = dy * dy;
        if(dy2 >= 1) continue;
        const row = (y - ya) * bw - xa;
        for(let x = px0; x <= px1; x++){
          const dx = (x + 0.5 - p.x) / p.kx;
          const q  = dx * dx + dy2;
          if(q >= 1) continue;
          /* 取最大值而不是累加。累加会在两核之间叠出比主核平台更高的假峰值
             （间距 1.1R 时中点算得 1.046 > 1.0），归一化基准被它占掉，
             主核平台反而掉出红色区间——红核只剩 1px 且质心偏到两核之间。
             这也是当初不敢铺点的原因：叠加饱和会让 1.2% 和 66% 一样红。 */
          const v = HEAT_KERNEL[(q * 256) | 0] * p.wgt;
          if(v > den[row + x]) den[row + x] = v;
        }
      }
    });

    let peak = 0;
    for(let i = 0; i < den.length; i++) if(den[i] > peak) peak = den[i];
    if(peak <= 0) return;

    /* 归一化到 inten：峰值只由点击率决定，与核数、模块大小无关 */
    for(let y = ya; y <= yb; y++){
      const src = (y - ya) * bw - xa, dst = y * CW;
      for(let x = xa; x <= xb; x++){
        const u = den[src + x];
        if(u <= 0) continue;
        const a = HEAT_GAMMA[(u / peak * 256) | 0] * inten;
        if(a > acc[dst + x]) acc[dst + x] = a;
      }
    }
  });

  /* 2) 上色：按热度查色带。模块重叠处同样取最大值而非累加，
     否则两个中等热度的模块相邻时，交界处会比真正的高热模块更红。 */
  const pal = palette();
  const ctx = cv.getContext('2d');
  const dat = ctx.createImageData(CW, CH);
  const d = dat.data;
  for(let i = 0, p = 0; i < acc.length; i++, p += 4){
    const a = acc[i];
    if(a <= 0) continue;
    const q = (a >= 1 ? 255 : (a * 255) | 0) * 4;
    d[p]   = pal[q];
    d[p+1] = pal[q+1];
    d[p+2] = pal[q+2];
    d[p+3] = pal[q+3] * a;
  }
  ctx.putImageData(dat, 0, 0);

  /* 3) 模块描边：1px 白色 50%，勾出模块划分范围。
     必须画在上色之后——画进灰度层的话，描边的 alpha 会被当成热度值去查色带，
     出来是热力色而不是白色。 */
  ctx.lineWidth   = dpr;
  ctx.strokeStyle = 'rgba(255,255,255,.5)';
  MODULES.forEach(m => {
    const x = m.left /100 * cv.width,  y = m.top   /100 * cv.height;
    const w = m.width/100 * cv.width,  h = m.height/100 * cv.height;
    /* 内缩半个线宽：线条压在整数坐标上会跨两列像素，被摊成两条更淡的线 */
    const X = x + dpr/2, Y = y + dpr/2, Wd = w - dpr, Ht = h - dpr;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(X, Y, Wd, Ht, 4 * dpr);   /* 与另一页 .zone 的 4px 圆角保持一致 */
    else              ctx.rect(X, Y, Wd, Ht);
    ctx.stroke();
  });

  renderTags(W, H);
}

/* ---------- 点击率标签 ----------
   标签必须落在热区之外：白色胶囊压在区域中心时会把最浓的颜色整块盖住，
   小区域（如「立即呼叫」只有 46px 高）会因此看起来比低点击率的模块还淡 */
function renderTags(W, H){
  const screen = document.getElementById('screen');
  Array.prototype.forEach.call(screen.querySelectorAll('.tag'), e => e.remove());

  const items = MODULES.map((m,i) => {
    const cx = (m.left + m.width / 2) / 100 * W;
    let cy = m.top / 100 * H - 11;                          /* 默认贴区域上沿之外 */
    if(cy < 13) cy = (m.top + m.height) / 100 * H + 11;     /* 顶部空间不足则移到下沿 */
    return {i:i, m:m, x:cx, y:cy};
  });
  /* 逐个避让：水平接近且垂直重叠的标签依次下移 */
  items.sort((a,b) => a.y - b.y);
  for(let k = 1; k < items.length; k++){
    for(let j = 0; j < k; j++){
      if(Math.abs(items[k].y - items[j].y) < 21 && Math.abs(items[k].x - items[j].x) < 76){
        items[k].y = items[j].y + 21;
      }
    }
  }

  items.forEach(it => {
    const m = it.m;
    const t = document.createElement('div');
    t.className = 'tag' + (m.rate === MAX ? ' top' : '') + (m.rate == null ? ' none' : '');
    t.textContent = m.rate == null ? '—' : m.rate.toFixed(1) + '%';
    t.title = m.name + '（' + m.id + '）';
    t.dataset.i = it.i;
    t.style.left = Math.max(30, Math.min(it.x, W - 30)) + 'px';
    t.style.top  = Math.max(13, Math.min(it.y, H - 13)) + 'px';
    screen.appendChild(t);
  });
}

/* ---------- 右侧清单 ---------- */
function renderTable(){
  const rows = MODULES.slice().sort((a,b) => (b.rate||-1) - (a.rate||-1));
  document.getElementById('tb').innerHTML = rows.map(m => {
    const idx = MODULES.indexOf(m);
    const rate = m.rate == null
      ? '<span style="color:var(--muted)">—</span>'
      : '<span class="rate" style="color:' + (m.rate === MAX ? 'var(--hot)' : 'var(--fg-1)') + '">' +
        m.rate.toFixed(1) + '%</span>';
    const bar = m.rate == null ? ''
      : '<div class="bar-out"><div class="bar-in" style="width:' +
        Math.max(2, m.rate / MAX * 100).toFixed(1) + '%"></div></div>';
    return '<tr data-i="' + idx + '">' +
      '<td>' + esc(m.name) + '<div class="mid">' + esc(m.id) + '</div></td>' +
      '<td>' + (m.clickUv == null ? '—' : m.clickUv.toLocaleString()) + '</td>' +
      '<td>' + rate + '<div class="mid">' + esc(m.base) + '</div></td>' +
      '<td class="bar-cell">' + bar + '</td>' +
    '</tr>';
  }).join('');
}

function renderNote(){
  document.getElementById('note').innerHTML =
    '<b>数据说明</b><br>' +
    '· 模块划分沿用配置端「询价页」热力区域；点击率取自 <code>usergrowth_create_journey_lift_明细.md</code>（点击UV ÷ 曝光UV）。<br>' +
    '· 「行程备注」「立即呼叫」在明细中没有曝光分母，改按页面曝光UV ' +
      PAGE_EXPO_UV.toLocaleString() + ' 换算（由品类卡片曝光UV 1,842,382 ÷ 曝光率 97.3% 推得），表中标注为「页面曝光」。<br>' +
    '· 「地图」未埋点击事件，热力层不着色。<br>' +
    '· 色彩强度对点击率做了平方根压缩，否则 66% 与 0.1% 并存时低值区域几乎不可见。';
}

/* ---------- 交互 ---------- */
document.getElementById('btnHeat').addEventListener('click', function(){
  this.classList.toggle('off');
  document.getElementById('heat').classList.toggle('hide', this.classList.contains('off'));
});
document.getElementById('btnData').addEventListener('click', function(){
  this.classList.toggle('off');
  const off = this.classList.contains('off');
  Array.prototype.forEach.call(document.querySelectorAll('.tag'), e => e.classList.toggle('hide', off));
});
/* 表格行与标签联动高亮 */
document.getElementById('tb').addEventListener('mouseover', e => {
  const tr = e.target.closest('tr'); if(!tr) return;
  const t = document.querySelector('.tag[data-i="' + tr.dataset.i + '"]');
  if(t){ t.style.transform = 'translate(-50%,-50%) scale(1.28)'; t.style.zIndex = 7; }
});
document.getElementById('tb').addEventListener('mouseout', e => {
  const tr = e.target.closest('tr'); if(!tr) return;
  const t = document.querySelector('.tag[data-i="' + tr.dataset.i + '"]');
  if(t){ t.style.transform = 'translate(-50%,-50%)'; t.style.zIndex = ''; }
});

/* ---------- 启动 ---------- */
renderTable();
renderNote();
const shot = document.getElementById('shot');
if(shot.complete) drawHeat();
else shot.addEventListener('load', drawHeat);
window.addEventListener('resize', drawHeat);
</script>
