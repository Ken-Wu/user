<style>
  /* ===== Design tokens（来自 Figma Frame 2130969442） ===== */
  :root{
    --brand:#00b2ff;
    --brand-hover:#00a1e6;
    --brand-soft:#e6f7ff;
    --border:#e6e8eb;
    --text-primary:#17181a;
    --text-secondary:#5e6266;
    --bg-secondary:#f4f7fa;
    --nav-chip:#f2f6fa;     /* 顶栏 tab 容器 / 配置按钮底色 */
    --surface:#fff;
    --radius-filters:12px;  /* 筛选卡 */
    --radius-result:16px;   /* 结果卡 */
    --radius-ctl:6px;       /* 下拉/按钮 */
    --radius-pill:100px;    /* tab / 配置 */
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  /* 关掉滚动边界的橡皮筋回弹：否则文档被拖动时 sticky 顶栏会跟着位移再弹回 */
  html{overscroll-behavior:none;}
  body{
    background:var(--bg-secondary); color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Arial,sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    padding-top:64px;              /* 让出 fixed 顶栏的高度 */
  }

  /* ===== 顶部导航 1440x64 =====
     用 fixed 而非 sticky：fixed 相对视口定位，滚动边界回弹时不随文档位移 */
  /* 毛玻璃：半透明底 + backdrop-filter，滚动时下方内容透出。
     原设计稿的大投影在玻璃质感下会显脏，改为细分隔线 + 更轻的投影 */
  .nav{height:64px;display:flex;align-items:center;padding:0 25px;
       position:fixed;top:0;left:0;right:0;z-index:100;
       background:rgba(255,255,255,.72);
       -webkit-backdrop-filter:saturate(180%) blur(20px);
       backdrop-filter:saturate(180%) blur(20px);
       border-bottom:1px solid rgba(17,61,112,.08);
       box-shadow:0 4px 16px 0 rgba(17,61,112,.06);}
  /* 不支持 backdrop-filter 时退回不透明白底，保证文字可读 */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .nav{background:var(--surface);border-bottom:none;
         box-shadow:5px 17px 30px 0 rgba(17,61,112,.13);}
  }
  .nav-brand{display:flex;align-items:center;gap:8px;}
  .nav-logo{width:30px;height:30px;flex:none;display:block;object-fit:contain;}
  .nav-title{font-size:18px;font-weight:600;line-height:25px;letter-spacing:.2px;}
  /* tabs：外层 234x44 容器，内层胶囊 112x36（padding 4 → 胶囊四周留白均匀） */
  .nav-tabs{position:absolute;left:50%;transform:translateX(-50%);
            height:44px;padding:4px;background:var(--nav-chip);
            border-radius:var(--radius-pill);display:flex;gap:2px;}
  /* 激活胶囊独立成层，切换时在两个 tab 之间滑动（跨页由 View Transitions 做 morph） */
  .nav-pill{position:absolute;top:4px;left:4px;width:112px;height:36px;z-index:0;
            border-radius:var(--radius-pill);background:var(--brand);
            transition:transform .28s cubic-bezier(.45,.05,.15,1);}
  .nav-tabs[data-active="path"] .nav-pill{transform:translateX(0);}
  .nav-tabs[data-active="page"] .nav-pill{transform:translateX(114px);}   /* 112 + gap 2 */
  .nav-tab{position:relative;z-index:1;
           width:112px;height:36px;border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;
           font-size:18px;font-weight:600;color:var(--text-secondary);cursor:pointer;text-decoration:none;
           transition:color .26s ease,transform .12s ease;}
  .nav-tab:hover{color:var(--text-primary);}
  .nav-tab:active{transform:scale(.96);}
  .nav-tab.active,.nav-tab.active:hover{color:#fff;}
  .nav-cfg{margin-left:auto;height:30px;padding:0 12px;border:none;border-radius:var(--radius-pill);
           display:flex;align-items:center;gap:3px;color:var(--text-secondary);font-size:16px;cursor:pointer;
           background:var(--nav-chip);text-decoration:none;
           transition:color .18s ease,background .18s ease;}
  .nav-cfg:hover{color:var(--brand);}
  /* 图标内联 svg 并把 stroke 交给 currentColor（与热力图工具按钮 .hm-ic 同一做法）：
     原来的 settings.png 是位图无法染色，内联后颜色跟随文字，hover 时图标与文字一起变蓝 */
  .nav-cfg-ico{width:16px;height:16px;flex:none;display:block;}

  /* ===== 主体 ===== */
  .page{padding:20px;}
  .card{background:var(--surface);}

  /* ===== 筛选卡片：圆角12 + 轻投影，无描边 =====
     自适应网格：列宽 213px 起，1440 视口下自动排成 6 列，
     恰好还原设计的「4 个单列 + 时间范围占 2 列」两行布局；变窄时按列数自然回流 */
  .filters{padding:20px;border-radius:var(--radius-filters);box-shadow:0 4px 6px rgba(0,0,0,.02);}
  .flt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(213px,1fr));gap:16px;align-items:center;
            grid-auto-flow:row dense;}
  .flt{display:flex;align-items:center;gap:8px;min-width:0;}
  .flt.wide{grid-column:span 2;}
  .flt-label{width:54px;flex:none;font-size:12px;line-height:17px;color:#666;text-align:right;white-space:nowrap;}
  .flt-ctl{flex:1;min-width:0;height:32px;}
  /* 下拉 */
  .sel{width:100%;height:32px;padding:0 26px 0 8px;border:1px solid var(--border);border-radius:var(--radius-ctl);
       background:var(--surface);color:#1d1d21;font-size:13px;line-height:18px;cursor:pointer;
       appearance:none;-webkit-appearance:none;
       background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%235e6266' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2.5 4.5 6 8l3.5-3.5'/%3E%3C/svg%3E");
       background-repeat:no-repeat;background-position:right 8px center;background-size:12px 12px;}
  .sel:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,178,255,.12);}
  /* 日期范围 */
  .daterange{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;background:var(--surface);
             border:1px solid var(--border);border-radius:var(--radius-ctl);}
  .daterange:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px rgba(0,178,255,.12);}
  .daterange input{flex:1;min-width:0;border:none;outline:none;background:transparent;
                   font-size:13px;color:#1d1d21;font-family:inherit;}
  .daterange span{color:var(--text-secondary);}
  /* 操作按钮 90x32：始终占据最后两列并右对齐 */
  .flt-actions{display:flex;gap:12px;grid-column:-3 / -1;justify-self:end;}
  /* 窄屏（不足 2 列）时取消跨列，避免溢出 */
  @media (max-width:560px){
    .flt.wide,.flt-actions{grid-column:auto;}
    .flt-actions{justify-self:start;}
  }
  /* 窄屏顶栏：tab 取消绝对居中，避免与 Logo / 配置 重叠 */
  @media (max-width:1000px){
    .nav{padding:0 16px;}
    .nav-tabs{position:relative;left:auto;transform:none;margin:0 auto;}  /* relative：保住胶囊定位上下文 */
    .nav-tab{width:96px;font-size:16px;}
    .nav-pill{width:96px;}
    .nav-tabs[data-active="page"] .nav-pill{transform:translateX(98px);}
  }
  .btn{width:90px;height:32px;border-radius:var(--radius-ctl);font-size:13px;font-weight:500;cursor:pointer;
       border:1px solid #eee;background:var(--surface);color:#666;font-family:inherit;}
  .btn:hover{border-color:var(--brand);color:var(--brand);}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;}
  .btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);color:#fff;}

  /* ===== 结果卡片 ===== */
  .result{margin-top:20px;padding:20px;border-radius:var(--radius-result);box-shadow:0 6px 12px rgba(94,98,102,.04);}
  .result-hd{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .result-title{font-size:16px;font-weight:600;line-height:22px;}
  .hl-toggle{height:24px;padding:0 10px;border:none;border-radius:var(--radius-pill);background:var(--bg-secondary);
             color:var(--text-secondary);font-size:12px;display:inline-flex;align-items:center;gap:4px;
             cursor:pointer;user-select:none;}
  .hl-toggle:hover{color:var(--brand);}
  .hl-toggle.on{background:var(--brand);color:#fff;}
  .hl-toggle svg{width:13px;height:13px;}
  /* 滑块组：每步Top / 展示步数 */
  .disp{display:flex;align-items:center;gap:24px;margin-left:auto;}
  .disp-item{display:flex;align-items:center;gap:5px;font-size:12px;line-height:17px;color:var(--text-primary);}
  .disp-item input[type=range]{width:60px;height:12px;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;}
  .disp-item input[type=range]::-webkit-slider-runnable-track{height:2px;background:rgba(23,24,26,.4);border-radius:10px;}
  .disp-item input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
        background:var(--brand);margin-top:-5px;}
  .disp-item input[type=range]::-moz-range-track{height:2px;background:rgba(23,24,26,.4);border-radius:10px;}
  .disp-item input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--brand);}
  .disp-v{min-width:15px;font-size:12px;color:var(--text-primary);font-variant-numeric:tabular-nums;}

  #sankey{width:100%;height:760px;}

  /* ===== 节点浮层（沿用原 demo） ===== */
  .node-pop{position:fixed;z-index:200;width:300px;background:#fff;border-radius:16px;
            box-shadow:0 8px 32px rgba(31,45,61,.14), 0 2px 8px rgba(0,0,0,.06);display:none;overflow:hidden;}
  .node-pop.show{display:block;}
  .np-hd{padding:14px 18px 10px;font-weight:700;font-size:16px;
         color:var(--text-primary);display:flex;justify-content:space-between;align-items:center;
         border-bottom:1px solid #F0F0F0;padding-bottom:12px;}
  .np-close{color:#b0bac7;cursor:pointer;font-size:20px;line-height:1;}
  .np-close:hover{color:#d03050;}
  .np-body{display:flex;gap:15px;padding:14px 18px 0 0;align-items:stretch;}
  .np-thumb{width:102px;flex:none;background:rgba(245,250,253,0.8);padding:10px 5px;
            position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
            margin-top:-14px;}
  .np-thumb img{width:70px;border-radius:4px;
    box-shadow:0 4px 12px rgba(31,45,61,.12), 0 1px 3px rgba(0,0,0,.06);display:block;}
  .np-thumb .np-mock-wrap{width:70px;padding:6px;background:#fff;border-radius:6px;
    box-shadow:0 4px 12px rgba(31,45,61,.12), 0 1px 3px rgba(0,0,0,.06);}
  .np-mock{width:100%;background:#fff;border:1px solid #e8eef4;border-radius:5px;padding:5px;}
  .np-mock .m-bar{height:6px;background:var(--brand);border-radius:2px;margin-bottom:4px;}
  .np-mock .m-line{height:3px;background:#e8eef4;border-radius:2px;margin-bottom:3px;}
  .np-mock .m-line.short{width:60%;}
  .np-mock .m-block{height:14px;background:#f1f5f9;border-radius:3px;margin:4px 0;}
  .np-mock .m-btn{height:6px;width:50%;background:#ffcc80;border-radius:2px;margin-top:4px;}
  .np-stats{flex:1;display:flex;flex-direction:column;gap:10px;padding-top:4px;}
  .np-stat{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;}
  .np-stat .k{color:var(--text-secondary);}
  .np-stat .v{font-weight:600;color:var(--text-primary);font-size:14px;}
  .np-acts{padding:12px 18px 16px;border-top:1px solid #F0F0F0;display:flex;gap:10px;}
  .np-btn{flex:1;padding:9px 0;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
          border:1px solid var(--border);background:#fff;color:var(--text-primary);text-align:center;white-space:nowrap;}
  .np-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .np-btn:hover{opacity:.88;}

  /* ===== 顶栏 tab 切换 =====
     只有激活胶囊做滑动，页面其余部分保持原样：不淡化、不位移。
     胶囊在当前页面滑到位之后才跳转（见页尾 JS），因此新旧两页的顶栏
     在导航发生时视觉完全一致，切换无感。
     跨文档 View Transitions 仅用于消除导航白屏，所有视觉动画一律关闭：
     若让 root 交叉淡化会闪烁；若让胶囊单独 morph，root 快照中胶囊
     位置为空，中途激活 tab 已是白字却仍在灰底上，文字会像消失一样。 */
  @view-transition{navigation:auto;}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){
      animation:none !important;}
  ::view-transition-old(root){opacity:0;}
  ::view-transition-new(root){opacity:1;}
  @media (prefers-reduced-motion:reduce){
    .nav-pill{transition:none;}
  }
</style>
</head>

<div class="page">

  <div class="card filters">
    <div class="flt-grid">
      <div class="flt">

// 根据 topX 切分 Top 节点与「更多」，并计算每步终止
function buildSankey(){
  const nodes=[], links=[];
  const nameSet=new Set();
  const addNode=(n)=>{ if(!nameSet.has(n)){ nameSet.add(n); nodes.push({name:n}); } };
  const factor = cfg.metric==='pv'?1.6:1;
  const stepCount = Math.min(cfg.steps, rawSteps.length-1);

  // 为每步生成"展示节点列表"（带唯一后缀避免跨步重名），保留 topX + 更多 + 终止
  const stepNodes=[]; // 每步: [{key, label, val}]
  for(let s=0;s<=stepCount;s++){
    const arr = rawSteps[s].map(x=>({label:x.name, val:Math.round(x.val*factor), other:!!x.other}));
    arr.sort((a,b)=>b.val-a.val);
    let shown, moreVal=0;
    if(s===0){ shown=arr; }
    else{
      const others = arr.filter(x=>x.other);   // 「其他页面」等非核心页面，始终展示，不占 Top 名额
      const normals = arr.filter(x=>!x.other);
      shown = normals.slice(0, cfg.topX).concat(others);
      moreVal = normals.slice(cfg.topX).reduce((a,x)=>a+x.val,0);
    }
    const list = shown.map(x=>({key:`S${s}·${x.label}`, label:x.label, val:x.val}));
    if(moreVal>0) list.push({key:`S${s}·更多`, label:'更多分组', val:moreVal, kind:'more'});
    stepNodes.push(list);
  }

  // 注册节点
  stepNodes.forEach(list=>list.forEach(n=>addNode(n.key)));
  // 每步追加终止节点（除最后一步）
  for(let s=0;s<stepCount;s++) addNode(`S${s}·终止`);

  // 生成相邻步连线：上一步总流量按下一步节点占比分配，剩余记为终止
  for(let s=0;s<stepCount;s++){
    const cur = stepNodes[s];
    const next = stepNodes[s+1];
    const curTotal = cur.reduce((a,b)=>a+b.val,0);
    const nextTotal = next.reduce((a,b)=>a+b.val,0);
    const flowTotal = Math.min(curTotal, nextTotal); // 流向下一步的总量
    const lossTotal = Math.max(curTotal-flowTotal, Math.round(curTotal*0.18)); // 终止量
    // 把 flowTotal 按 cur 各节点比例切分，再按 next 占比落到 next 节点
    cur.forEach(cn=>{
      const cShare = cn.val/curTotal;
      next.forEach(nn=>{
        const v = Math.round(flowTotal*cShare*(nn.val/nextTotal));
        if(v>0) links.push({source:cn.key, target:nn.key, value:v});
      });
      // 该节点的终止
      const lv = Math.round(lossTotal*cShare);
      if(lv>0) links.push({source:cn.key, target:`S${s}·终止`, value:lv, loss:true});
    });
  }
  return {nodes, links, stepNodes, stepCount};
}

  '顺风车履约-待乘客上车':'#FFAB91',     // Deep Orange 200
  '顺风车履约-待司乘到达终点':'#81D4FA', // Light Blue 200
  '顺风车履约-行程完成':'#A5D6A7',       // Green 200，语义固定：完成 = 绿
  '顺风车履约-订单取消':'#EF9A9A'        // Red 200，语义固定：异常 = 红
};
// 三档语义中性色：其他=浅蓝灰 / 更多=冷灰绿 / 终止=极浅蓝灰
// key 用节点名 split('·') 后的实际值：'更多' 而非 '更多分组'，否则匹配不到会落到备用色
const NEUTRAL_COLOR = {
  '其他页面':'#D7DDE6',
  '更多':'#DDE6E5', '更多分组':'#DDE6E5',
  '终止':'#DFE3E9'
};
// 未登记页面的备用色（补足 20 色），沿用 v1 独有的两个 + 一个淡陶土色，与上表不撞色
const sankeyPalette = ['#8EA9F3','#F6A5C0','#E6B8AF'];
let labelColorMap = {};
function hexRgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function colorForLabel(label){
  if(NEUTRAL_COLOR[label]) return NEUTRAL_COLOR[label];   // 其他页面 / 更多分组 / 终止
  if(PAGE_COLOR_MAP[label]) return PAGE_COLOR_MAP[label]; // 已登记页面走固定色
  if(!(label in labelColorMap)) labelColorMap[label] = sankeyPalette[Object.keys(labelColorMap).length % sankeyPalette.length];
  return labelColorMap[label];
}
function renderSankey(){
  if(!sankeyChart){
    sankeyChart = echarts.init(document.getElementById('sankey'));
    sankeyChart.getZr().on('click', e=>{ if(!e.target){ closeNodePop(); if(pathHL){ pathHL=null; renderSankey(); } } }); // 点击空白处关闭浮层并取消高亮
  }
  const {nodes, links, stepNodes, stepCount} = buildSankey();
  curLinks = links;
  // 计算每个节点的流量(取进/出较大值)用于展示 PV
  const inSum={}, outSum={}, nodeVal={}, lossByNode={};
  links.forEach(l=>{ outSum[l.source]=(outSum[l.source]||0)+l.value; inSum[l.target]=(inSum[l.target]||0)+l.value;
    if(l.loss) lossByNode[l.source]=(lossByNode[l.source]||0)+l.value; });
  nodes.forEach(n=>{ nodeVal[n.name] = Math.max(inSum[n.name]||0, outSum[n.name]||0); });
  // 记录每个节点的元信息，供点击浮层使用
  nodeMeta = {};
  nodes.forEach(n=>{
    const pv = nodeVal[n.name]||0, loss = lossByNode[n.name]||0;
    const label = n.name.split('·').pop();
    const ps = (typeof pageStats!=='undefined') ? pageStats[label] : null;
    nodeMeta[n.name] = { label, pv, loss, lossRate: pv>0 ? loss/pv : 0,
      totalPv: ps?ps.pv:null, totalUv: ps?ps.uv:null };
  });
  nodeOutSum = outSum;   // 供连线 tooltip 计算转化率（连线量 / 源节点总流出）

  labelColorMap = {}; // 每次渲染重置，保证配色稳定
  // 是否变浅：单路径模式或多选模式（且已选节点）
  const dimNode = k => (pathHL && !pathHL.nodeKeys.has(k)) || (multiHL && multiHL.nodes.size>0 && !multiHL.nodes.has(k));
  const styledNodes = nodes.map(n=>{
    const label = n.name.split('·').pop();
    const c = colorForLabel(label);
    const dim = dimNode(n.name);
    // 全部节点统一浅底描边：填充 0.18 + 同色纯色描边，中性节点不做加深处理
    // 三个中性节点因此会很淡、几乎沉入背景，这是刻意的：它们不是分析重点
    return {
      name:n.name, value: nodeVal[n.name]||0,
      itemStyle:{ color: hexRgba(c, dim?0.06:0.18), borderColor:c, borderWidth:1.4, opacity: dim?0.3:1 },
      label:{ color: dim?'#c2c8d0':'#3a4554' }
    };
  });
  const grad=(c1,c2,a)=>({type:'linear',x:0,y:0,x2:1,y2:0,
    colorStops:[{offset:0,color:hexRgba(c1,a)},{offset:1,color:hexRgba(c2,a)}]});
  const styledLinks = links.map(l=>{
    const dim = (pathHL && !pathHL.linkKeys.has(l.source+'__'+l.target))
              || (multiHL && multiHL.links.size>0 && !multiHL.links.has(l.source+'__'+l.target));
    const sc = colorForLabel(l.source.split('·').pop());
    // 流向终止的连线：渐变终点用「终止」原色，透明度压到 0.42，读起来就是「走到这儿断了」
    if(l.loss) return {...l, lineStyle:{ color:grad(sc,NEUTRAL_COLOR['终止'], dim?0.05:0.42) }};
    const tc = colorForLabel(l.target.split('·').pop());
    return {...l, lineStyle:{ color:grad(sc,tc, dim?0.06:0.72) }};
  });
  // 节点宽度按步数自适应：步数少则更宽，文字居中放在方框里
  const nodeW = Math.round(Math.max(78, Math.min(120, 880/(stepCount+1))));
  // 步数多时按需加宽画布，超出容器则在外层横向滚动
  (function(){ const el=document.getElementById('sankey'); const wrapW=el.parentElement?el.parentElement.clientWidth:el.clientWidth;
    el.style.width = Math.max(wrapW, (stepCount+1)*150) + 'px';
    let maxCol=0; stepNodes.forEach((list,s)=>{ const c=list.length+(s<stepCount?1:0); if(c>maxCol)maxCol=c; }); // 每列实际节点数（含终止）
    el.style.height = Math.max(700, maxCol*74) + 'px';  // 高度按最密集列的节点数自适应，不受 Top 上限虚高
    if(sankeyChart) sankeyChart.resize(); })();
  sankeyChart.setOption({
    tooltip:{trigger:'item',triggerOn:'mousemove',
      formatter:p=>{
        const D=getDays();
        const avg = v=>Math.round((v||0)/D).toLocaleString();
        if(p.dataType==='edge'){
          // 连线转化率 = 该连线流量 / 源节点总流出
          const srcOut = (nodeOutSum[p.data.source]||0);
          const rate = srcOut>0 ? (p.data.value/srcOut) : 0;
          return `${p.data.source.split('·').pop()} → ${p.data.target.split('·').pop()}<br/>`+
                 `日均 PV：<b>${avg(p.data.value)}</b><br/>`+
                 `转化率：${(rate*100).toFixed(1)}%`;
        }
        const m = nodeMeta[p.name] || {pv:p.value||0, loss:0, lossRate:0};
        const totalLine = (m.totalPv!=null)
          ? `日均页面总 PV：${avg(m.totalPv)}<br/>日均页面总 UV：${avg(m.totalUv)}<br/>`
          : '';
        return `<b>${p.name.split('·').pop()}</b><br/>`+
               totalLine+
               `当前节点日均 PV：${avg(m.pv)}<br/>`+
               `当前节点日均终止 PV：${avg(m.loss)}<br/>`+
               `终止率：${((m.lossRate||0)*100).toFixed(1)}%`;
      }},
    series:[{
      type:'sankey', emphasis: pathHL?{disabled:true}:multiHL?{disabled:false, focus:'none'}:{disabled:false, focus:'adjacency'}, draggable:false,
      // 固定像素而非百分比：画布宽会被拉到 (步数+1)*150≈3900px、高最大 ~1850px，
      // 百分比会被放大成上百 px 的空白（首列离卡片左边太远、标题与图之间断层）
      left:6, right:20, top:8, bottom:8,
      nodeWidth:nodeW, nodeGap:11, nodeAlign:'left', layoutIterations:0,
      data:styledNodes, links:styledLinks,
      label:{ color:'#3a4554', fontSize:11, lineHeight:15, position:'inside',
        formatter:p=>{ const nm=p.name.split('·').pop(); if(p.name.indexOf('S0·')===0 && nm!=='终止' && nm!=='更多分组') return nm; return `${nm}\n${Math.round((p.value||0)/getDays()).toLocaleString()}`; } },
      lineStyle:{ curveness:.5 }
    }]
  });
  sankeyChart.off('click');
  sankeyChart.on('click', p=>{
    if(p.dataType==='node'){
      const label=p.name.split('·').pop();
      if(label==='终止'||label==='更多分组') return;
      // 多选高亮模式下，点击节点切换高亮，不弹浮层
      if(multiHL){ toggleMultiNode(p.name); return; }
      const ev = p.event && p.event.event;
      openNodePop(p.name, ev?ev.clientX:window.innerWidth/2, ev?ev.clientY:200);
    }
  });
}

/* ---- 节点点击浮层 ---- */
function openNodePop(nodeName, x, y){
  curNodeName = nodeName;
  const m = nodeMeta[nodeName] || {label:nodeName.split('·').pop(), pv:0, loss:0, lossRate:0};
  const set=(id,val)=>{ const el=document.getElementById(id); if(el) el.innerText=val; };
  const D=getDays();
  const avg = v => v==null ? '-' : Math.round(v/D).toLocaleString();
  set('npName', m.label);
  // 显示页面真实截图（如果有）
  const pageImg = (pageConfig.find(p=>p.name===m.label)||{}).img || '';
  const thumbImg = document.getElementById('npThumbImg');
  const thumbMock = document.getElementById('npThumbMock');
  if(thumbImg && thumbMock){
    if(pageImg){ thumbImg.src=pageImg; thumbImg.style.display='block'; thumbMock.style.display='none'; }
    else { thumbImg.style.display='none'; thumbMock.style.display='block'; }
  }
  set('npTotalPv', avg(m.totalPv));
  set('npTotalUv', avg(m.totalUv));
  set('npPv', avg(m.pv||0));
  set('npLoss', avg(m.loss||0));
  set('npRate', ((m.lossRate||0)*100).toFixed(1) + '%');
  set('npHlBtn', pathHL ? '取消全部高亮' : '高亮节点');
  const pop = document.getElementById('nodePop');
  pop.classList.add('show');
  popOpen = true;
  lockHover(true);
  const w = 300, h = pop.offsetHeight || 360;
  pop.style.left = Math.min(x+12, window.innerWidth - w - 12) + 'px';
  pop.style.top  = Math.min(y+8, window.innerHeight - h - 12) + 'px';
}
function closeNodePop(){
  document.getElementById('nodePop').classList.remove('show');
  popOpen = false;
  lockHover(!!pathHL); // 仍处于高亮态则保持锁定，否则恢复 hover
}
function onHlBtn(){ if(pathHL) clearHighlight(); else highlightNode(); }
function clearHighlight(){ pathHL=null; renderSankey(); closeNodePop(); }
function highlightNode(){
  if(!curNodeName) return;
  // 高亮所有经过当前节点的链路：向前追溯所有能到达该节点的路径，向后追溯所有从该节点出发的路径
  const nodeKeys=new Set([curNodeName]), linkKeys=new Set();
  // 向后：从当前节点出发，BFS 找到所有下游节点和连线
  const queue=[curNodeName];
  while(queue.length){
    const cur=queue.shift();
    curLinks.filter(l=>l.source===cur && !l.loss).forEach(l=>{
      const key=l.source+'__'+l.target;
      if(!linkKeys.has(key)){ linkKeys.add(key); nodeKeys.add(l.target); queue.push(l.target); }
    });
  }
  // 向前：从当前节点出发，BFS 找到所有上游节点和连线
  const queue2=[curNodeName];
  while(queue2.length){
    const cur=queue2.shift();
    curLinks.filter(l=>l.target===cur && !l.loss).forEach(l=>{
      const key=l.source+'__'+l.target;
      if(!linkKeys.has(key)){ linkKeys.add(key); nodeKeys.add(l.source); queue2.push(l.source); }
    });
  }
  pathHL = {nodeKeys, linkKeys};
  renderSankey();
  closeNodePop();
}

const pageList = ['平台首页','乘客首页','登录页','POI页','询价页','发单动画','等待接单页','确认同行页',
  '风控预付页','支付页','顺风车履约-订单取消','顺风车履约-待车主接单','顺风车履约-待乘客确认',
  '顺风车履约-待车主到达起点','顺风车履约-待乘客上车','顺风车履约-待司乘到达终点','顺风车履约-行程完成'];

/* ===== 顶栏 tab 切换 =====
   点击后先在当前页面把胶囊滑到目标位置，滑完再跳转。
   这样导航发生时新旧两页顶栏状态一致，页面内容瞬切，不淡化不位移。 */
(function(){
  const tabs = document.querySelector('.nav-tabs');
  const pill = document.querySelector('.nav-pill');
  const calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SLIDE = 280;   // 与 .nav-pill 的 transition-duration 对齐

  document.querySelectorAll('.nav-tab[href]').forEach(a=>{
    a.addEventListener('click', e=>{
      // 新标签页/中键打开不拦截
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      // 胶囊滑向目标，文字色同步过渡
      if(tabs && a.dataset.tab) tabs.dataset.active = a.dataset.tab;
      document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active', t === a));
      if(calm){ location.href = a.href; return; }
      let jumped = false;
      const go = ()=>{ if(jumped) return; jumped = true; location.href = a.href; };
      if(pill) pill.addEventListener('transitionend', go, {once:true});
      setTimeout(go, SLIDE + 60);        // transitionend 未触发时兜底
    });
  });

  // 后退返回缓存页时复位胶囊与文字态
  window.addEventListener('pageshow', ev=>{
    if(!ev.persisted || !tabs) return;
    const own = tabs.dataset.activeInit;
    if(!own) return;
    tabs.dataset.active = own;
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active', t.dataset.tab === own));
  });
})();
